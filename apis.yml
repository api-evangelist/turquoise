name: Turquoise Health
description: >-
  Turquoise Health is a healthcare price transparency company (backed by a16z) that runs a
  platform aggregating and normalizing hospital and payer machine-readable price transparency
  files, negotiated contract rates, and out-of-network pricing into searchable, benchmarked
  rate data and analytics. Its products span rate analysis and benchmarking, contract
  management, clear rates and data assets, healthcare transactions, out-of-network pricing,
  patient cost estimates / Good Faith Estimates, and price-transparency compliance tooling,
  serving providers, payers, life sciences, and employers.
